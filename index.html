<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Arcade Hub</title>
  <meta name="description" content="Arcade Hub — minijogos sociais gratuitos com níveis, prestígio, amigos e duelos.">
  <meta name="theme-color" content="#6c4cf5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Arcade Hub">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20261031">
  <script src="https://unpkg.com/lucide@0.400.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>

  <div class="app" id="app">
    <!-- Sidebar (desktop) -->
    <aside class="sidebar" aria-label="Navegação principal">
      <a href="#/home" class="brand" aria-label="Arcade Hub — início">
        <span class="brand-mark"><i data-lucide="gamepad-2"></i></span>
        <span class="brand-name">Arcade<b>Hub</b></span>
      </a>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-footer">
        <a href="#/settings" class="side-link" data-route="settings"><i data-lucide="settings"></i><span>Configurações</span></a>
        <div class="side-note"><i data-lucide="flask-conical"></i> Protótipo · dados locais</div>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar" id="topbar">
        <a href="#/home" class="brand brand-compact" aria-label="Arcade Hub — início">
          <span class="brand-mark"><i data-lucide="gamepad-2"></i></span>
          <span class="brand-name">Arcade<b>Hub</b></span>
        </a>
        <form class="search" id="searchForm" role="search">
          <i data-lucide="search"></i>
          <input id="searchInput" type="search" placeholder="Buscar jogos…" aria-label="Buscar jogos" autocomplete="off">
        </form>
        <div class="top-actions" id="topActions"></div>
      </header>

      <main id="main" class="view" tabindex="-1"></main>
    </div>

    <!-- Bottom nav (mobile) -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Navegação"></nav>
  </div>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script>
    // iOS: sem seleção de texto, menu de segurar nem zoom por duplo toque (exceto em campos de texto)
    (function () {
      const campo = (e) => e.target && e.target.closest && e.target.closest('input, textarea, [contenteditable="true"]');
      document.addEventListener('selectstart', (e) => { if (!campo(e)) e.preventDefault(); });
      document.addEventListener('contextmenu', (e) => { if (!campo(e)) e.preventDefault(); });
      ['gesturestart', 'gesturechange', 'gestureend'].forEach((n) => document.addEventListener(n, (e) => e.preventDefault()));
      let ultimo = 0;
      document.addEventListener('touchend', (e) => {
        const t = Date.now();
        if (t - ultimo < 350 && !campo(e)) e.preventDefault();
        ultimo = t;
      }, { passive: false });
    })();
  </script>
  <script src="js/config.js?v=20261031"></script>
  <script src="js/data.js?v=20261031"></script>
  <script src="js/gameshop.js?v=20261031"></script>
  <script src="js/store.js?v=20261031"></script>
  <script src="js/cloud.js?v=20261031"></script>
  <script src="js/online.js?v=20261031"></script>
  <script src="js/ui.js?v=20261031"></script>
  <script src="js/games.js?v=20261031"></script>
  <script src="js/cars-levels.js?v=20261031"></script>
  <script src="js/games-levels.js?v=20261031"></script>
  <script src="js/games-extra.js?v=20261031"></script>
  <script src="js/games-arcade.js?v=20261031"></script>
  <script src="js/games-board.js?v=20261031"></script>
  <script src="js/games-board2.js?v=20261031"></script>
  <script src="js/views.js?v=20261031"></script>
  <script src="js/app.js?v=20261031"></script>
</body>
</html>
